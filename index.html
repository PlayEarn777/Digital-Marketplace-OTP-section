<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMS Active Mini App</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-main: #f8fafc;
      --sidebar-bg: #1e293b;
      --yellow-accent: #facc15;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 15px; }
    .container { max-width: 600px; margin: 0 auto; }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; color: #fff; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
    .balance-badge { background: var(--yellow-accent); color: #000; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 14px; }

    h2 { font-size: 18px; margin-bottom: 12px; color: #1e293b; border-bottom: 2px solid var(--border-color); padding-bottom: 6px; }

    /* Service Grid */
    .services-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
    .service-btn { background: #fff; border: 2px solid var(--border-color); border-radius: 8px; padding: 10px 5px; text-align: center; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; }
    .service-btn:hover, .service-btn.selected { border-color: #000; background: #0f172a; color: #fff; }

    /* Countries Grid */
    .country-list { display: flex; flex-direction: column; gap: 10px; }
    .country-item { background: #fff; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
    .country-item:hover { border-color: #38bdf8; background: #f1f5f9; }
    .c-name { font-weight: bold; font-size: 14px; }
    .c-stock { font-size: 11px; color: #16a34a; font-weight: bold; }
    .c-price { background: #0f172a; color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 13px; font-weight: bold; }

    /* Modal */
    #orderModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
    .modal-box { background: #fff; width: 90%; max-width: 400px; padding: 25px; border-radius: 12px; text-align: center; color: #000; }
    .phone-box { font-size: 22px; font-weight: bold; color: #0284c7; background: #f1f5f9; padding: 10px; border-radius: 6px; margin: 15px 0; word-break: break-all; }
    .code-box { font-size: 24px; font-weight: 900; color: #16a34a; background: #dcfce7; padding: 12px; border-radius: 8px; margin-top: 15px; border: 2px dashed #22c55e; }
    .action-btn { background: #ef4444; color: #fff; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 20px; font-size: 15px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <span>⚡ SMS ACTIVE MINI APP</span>
    <div class="balance-badge" id="balanceDisplay">0.00$</div>
  </div>

  <h2>Select Service</h2>
  <div class="services-grid" id="servicesGrid">
    <!-- Populated by JS -->
  </div>

  <h2>Available Countries</h2>
  <div class="country-list" id="countryList">
    <p style="color: var(--text-muted); text-align: center;">Select a service above to view stock.</p>
  </div>
</div>

<!-- Order Modal -->
<div id="orderModal">
  <div class="modal-box">
    <h3>Active Activation</h3>
    <p>Your rented phone number:</p>
    <div class="phone-box" id="modalPhone">Connecting...</div>
    <div class="code-box" id="modalCode">Waiting for SMS code...</div>
    <button class="action-btn" onclick="closeModal()">Close / Cancel</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
