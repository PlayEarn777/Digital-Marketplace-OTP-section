<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TH-DATA Panel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2c;
      --border: #232d42;
      --blue: #38bdf8;
      --green: #22c55e;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
    .wrap { max-width: 600px; margin: 0 auto; }
    .box { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 10px; margin-bottom: 15px; }
    input, select, button { width: 100%; padding: 12px; margin-top: 8px; background: var(--bg); border: 1px solid var(--border); color: #fff; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    button { background: var(--blue); color: #000; font-weight: bold; cursor: pointer; border: none; }
    button:hover { opacity: 0.9; }
    .bal { color: var(--blue); font-weight: bold; font-size: 16px; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="wrap">
  <div class="box">
    <h2>⚡ TH-DATA Quick Panel</h2>
    <div class="bal" id="balanceText">Balance: Not Connected</div>
    <label>API Token:</label>
    <input type="text" id="tokenInput" placeholder="Paste your TH-DATA token here..." />
    <button onclick="saveToken()">Save & Check Balance</button>
  </div>

  <div class="box">
    <h2>Create Screening Task</h2>
    <label>Service Type:</label>
    <select id="serviceType">
      <option value="wsValid">WhatsApp Valid Check</option>
      <option value="tgValid">Telegram Valid Check</option>
      <option value="fbValid">Facebook Valid Check</option>
      <option value="insValid">Instagram Valid Check</option>
    </select>

    <label>Country Code:</label>
    <input type="text" id="countryCode" value="US" />

    <label>Upload Numbers (.txt):</label>
    <input type="file" id="txtFile" accept=".txt" />

    <button style="background: var(--green); margin-top: 15px;" onclick="runTask()">Start Task</button>
  </div>

  <div class="box" id="resultBox" style="display:none;">
    <h3>Task Status</h3>
    <p id="statusOutput" style="color: var(--muted);"></p>
  </div>
</div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  const PROXY = "https://api.allorigins.win/raw?url=";
  let token = localStorage.getItem("th_token") || "";

  document.addEventListener("DOMContentLoaded", () => {
    if (token) {
      document.getElementById("tokenInput").value = token;
      fetchBal();
    }
  });

  function saveToken() {
    token = document.getElementById("tokenInput").value.trim();
    if (!token) return alert("Enter token!");
    localStorage.setItem("th_token", token);
    fetchBal();
  }

  async function fetchBal() {
    try {
      const res = await fetch(PROXY + encodeURIComponent("https://api.th333.cc/api/user/balance"), {
        headers: { "token": token }
      });
      const data = await res.json();
      document.getElementById("balanceText").innerText = "Balance: " + (data.data?.balance || data.data?.integral || "Connected");
    } catch(e) {
      document.getElementById("balanceText").innerText = "Balance: Error connecting API";
    }
  }

  async function runTask() {
    if (!token) return alert("Connect token first!");
    const file = document.getElementById("txtFile").files[0];
    if (!file) return alert("Select a .txt file!");

    const formData = new FormData();
    formData.append("file", file);
    formData.append("taskType", document.getElementById("serviceType").value);
    formData.append("country", document.getElementById("countryCode").value);

    document.getElementById("resultBox").style.display = "block";
    document.getElementById("statusOutput").innerText = "Uploading and processing...";

    try {
      const res = await fetch("https://api.th333.cc/api/task/create", {
        method: "POST",
        headers: { "token": token },
        body: formData
      });
      const result = await res.json();
      if (result.code === 0) {
        document.getElementById("statusOutput").innerText = "Task Created Successfully! ID: " + result.data.taskId;
      } else {
        document.getElementById("statusOutput").innerText = "Failed: " + (result.message || JSON.stringify(result));
      }
    } catch (err) {
      document.getElementById("statusOutput").
