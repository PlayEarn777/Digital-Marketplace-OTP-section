<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TH-DATA Intelligence & Screening Panel</title>
  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: #151c2c;
      --card-border: #232d42;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-yellow: #facc15;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-dark); color: var(--text-main); padding: 20px; line-height: 1.5; }
    .container { max-width: 1000px; margin: 0 auto; }

    /* Header & Config */
    .header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--card-border); margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
    .header h1 { font-size: 20px; color: var(--accent-blue); display: flex; align-items: center; gap: 8px; }
    .balance-box { background: rgba(56, 189, 248, 0.1); border: 1px solid var(--accent-blue); padding: 8px 16px; border-radius: 8px; font-weight: bold; color: var(--accent-blue); }

    .token-bar { display: flex; gap: 10px; width: 100%; margin-top: 10px; }
    .token-bar input { flex-grow: 1; background: var(--bg-dark); border: 1px solid var(--card-border); padding: 10px 14px; border-radius: 6px; color: #fff; font-size: 14px; }
    .token-bar button { background: var(--accent-blue); border: none; color: #000; font-weight: bold; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    .token-bar button:hover { opacity: 0.9; }

    /* Task Submission Card */
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    .card h2 { font-size: 16px; margin-bottom: 15px; color: var(--text-main); border-bottom: 1px solid var(--card-border); padding-bottom: 10px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: bold; }
    .form-group select, .form-group input[type="text"], .form-group input[type="file"] {
      width: 100%; background: var(--bg-dark); border: 1px solid var(--card-border); color: #fff; padding: 10px; border-radius: 6px; font-size: 14px;
    }

    .btn-submit { background: var(--accent-green); color: #000; border: none; font-weight: bold; width: 100%; padding: 12px; border-radius: 6px; font-size: 16px; cursor: pointer; transition: 0.2s; }
    .btn-submit:hover { opacity: 0.9; }
    .btn-submit:disabled { background: var(--card-border); color: var(--text-muted); cursor: not-allowed; }

    /* Progress & Active Task */
    .progress-box { display: none; background: var(--bg-dark); border: 1px solid var(--card-border); padding: 15px; border-radius: 8px; margin-top: 20px; }
    .progress-bar-bg { background: var(--card-border); height: 10px; border-radius: 5px; overflow: hidden; margin: 10px 0; }
    .progress-bar-fill { background: var(--accent-blue); width: 0%; height: 100%; transition: width 0.3s; }
